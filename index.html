<!DOCTYPE html>

<head>

  <meta name="description" content="English Writing Studio — a friendly, no-login place to practise and improve your English writing from A1 to C2." />
  <title>English Writing Studio</title>

  <!-- Apply the saved theme before paint to avoid a flash of the wrong theme. -->
  <script>
    (function () {
      try {
        function readAppearance() {
          try {
            var raw = localStorage.getItem("ews.settings.v1");
            if (raw) {
              var s = JSON.parse(raw);
              if (s && s.appearance) return s.appearance;
            }
          } catch (e) {}
          return "system";
        }
        var appearance = readAppearance();
        function resolve(a) {
          if (a === "light" || a === "dark") return a;
          try {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
          } catch (e) {}
          return "light";
        }
        document.documentElement.setAttribute("data-theme", resolve(appearance));
        document.documentElement.setAttribute("data-appearance", appearance);
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
            if (readAppearance() === "system") {
              document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
            }
          });
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>" />
